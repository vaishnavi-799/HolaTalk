
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PrivateChat</title>
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="PrivateChat - Connect and chat privately.">

  <!-- Installable web app settings -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon.svg">

  <!-- Existing stylesheet -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body>
  <div id="auth" class="container py-5" style="max-width:420px">
    <h3 class="mb-3">PrivateChat</h3>
    <div id="err" class="alert alert-danger d-none"></div>

    <form id="af" class="d-grid gap-2">
      <input name="username" class="form-control"
             placeholder="Username" autocomplete="username">

      <input name="displayName" class="form-control reg d-none"
             placeholder="Display name">

      <input name="email" type="email" class="form-control reg d-none"
             placeholder="Email">

      <input name="password" type="password" class="form-control"
             placeholder="Password" autocomplete="current-password">

      <input name="confirmPassword" type="password"
             class="form-control reg d-none" placeholder="Confirm password">

      <button id="sub" class="btn btn-primary">Log in</button>
      <button id="toggle" type="button" class="btn btn-link">
        Log in / Register
      </button>
    </form>
  </div>

  <div id="chat" class="d-none">
    <aside id="side">
      <div class="p-2 d-flex justify-content-between align-items-center">
        <b>PrivateChat</b>
        <button id="out" class="btn btn-sm btn-outline-secondary">Logout</button>
      </div>

      <input id="q" class="form-control form-control-sm mx-2 mb-2"
             style="width:calc(100% - 1rem)" placeholder="Search users…">
      <div id="list"></div>
    </aside>

    <main id="main">
      <header class="p-2 border-bottom d-flex align-items-center gap-2">
        <button id="back" class="btn btn-sm d-md-none">←</button>
        <div>
          <b id="hn">Select a conversation</b>
          <div id="hs" class="small text-muted"></div>
        </div>
      </header>

      <div id="msgs"></div>
      <div id="pv" class="d-none p-2 border-top"></div>

      <footer class="p-2 border-top d-flex gap-2">
        <label class="btn btn-light mb-0">
          📎
          <input type="file" id="file" hidden
                 accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm">
        </label>

        <button id="loc" class="btn btn-light">📍</button>
        <input id="txt" class="form-control" maxlength="2000"
               placeholder="Type a message">
        <button id="send" class="btn btn-primary">Send</button>
      </footer>
    </main>
  </div>

  <!-- Existing chat functionality -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/app.js"></script>

  <!-- Register service worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .catch(error => console.error('Service worker registration failed:', error));
      });
    }
  </script>
</body>
</html>
